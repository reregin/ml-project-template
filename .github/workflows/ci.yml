name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83,<84"
          python -m pip install -e ".[dev,experiment,serve]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit installed Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --ignore-vuln PYSEC-2026-3552

      # TEMPLATE_MAINTAINER_ONLY_START
      - name: Verify all template markers are declared
        run: python scripts/check_template_markers.py
      # TEMPLATE_MAINTAINER_ONLY_END

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src

      - name: Scan source for common security issues
        run: python -m bandit -q -r src app scripts

      - name: Test with branch coverage
        run: python -m pytest

      # TEMPLATE_MAINTAINER_ONLY_START
      - name: Prove a standalone generated project passes its quality gate
        if: matrix.python-version == '3.12'
        run: |
          python scripts/instantiate_template.py \
            --destination "${RUNNER_TEMP}/fresh-neutral-project" \
            --project-name fresh-neutral-project \
            --package-name fresh_neutral_project
          python -m pip install -e "${RUNNER_TEMP}/fresh-neutral-project[dev,experiment,serve]"
          cd "${RUNNER_TEMP}/fresh-neutral-project"
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy src
          python -m bandit -q -r src app scripts
          python -m pytest
      # TEMPLATE_MAINTAINER_ONLY_END
