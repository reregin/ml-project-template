name: Train and package model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-package.yml"
      - "pyproject.toml"
      - "examples/binary_classification/sample_request.json"
      - "src/ml_project_template/**"
  pull_request:
    paths:
      - ".github/workflows/train-package.yml"
      - "pyproject.toml"
      - "examples/binary_classification/sample_request.json"
      - "src/ml_project_template/**"

permissions:
  contents: read

concurrency:
  group: train-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package workflow dependencies
        run: python -m pip install -e ".[experiment]"

      - name: Generate deterministic raw fixture
        run: python -m ml_project_template.example_data

      - name: Prepare and identify training data
        run: |
          python -m ml_project_template.prepare_data \
            --source-uri generated://neutral-binary-classification/${{ github.sha }}

      - name: Train, quality-gate, and package
        run: |
          python -m ml_project_template.model_package \
            --version ${{ github.sha }} \
            --tracking-uri sqlite:///mlflow.db

      - name: Validate package independently
        run: |
          ml-template-validate-package \
            --package artifacts/model-packages/${{ github.sha }}

      - name: Build non-root serving image
        run: docker build --tag ml-project-template-api:${{ github.sha }} .

      - name: Start container with exact model package
        run: |
          docker run --detach \
            --name prediction-api \
            --publish 8000:8000 \
            --read-only \
            --tmpfs /tmp:size=128m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "${{ github.workspace }}/artifacts/model-packages/${{ github.sha }}:/opt/model-package:ro" \
            ml-project-template-api:${{ github.sha }}

      - name: Wait for model readiness
        run: python scripts/wait_for_service.py --timeout 90

      - name: Exercise normal, invalid, and burst traffic
        run: |
          python scripts/smoke_service.py --mode normal
          python scripts/smoke_service.py --mode invalid
          python scripts/smoke_service.py --mode burst --count 10

      - name: Compare container and direct model predictions
        run: |
          python scripts/compare_service_prediction.py \
            --package artifacts/model-packages/${{ github.sha }}

      - name: Show container logs after failure
        if: failure()
        run: docker logs prediction-api || true

      - name: Stop smoke-test container
        if: always()
        run: docker rm --force prediction-api || true

      - name: Upload immutable model package
        uses: actions/upload-artifact@v4
        with:
          name: model-package-${{ github.sha }}
          path: artifacts/model-packages/${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
