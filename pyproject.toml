[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-project-template"
version = "0.1.0"
description = "A progressive, executable template for tabular machine-learning projects."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3,<2",
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
experiment = [
    "jupyter>=1,<2",
    "matplotlib>=3.8,<4",
    "mlflow>=2.10,<4",
    "seaborn>=0.13,<1",
    "statsmodels>=0.14,<1",
]
app = ["streamlit>=1.30,<2"]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
ml-template-generate-data = "ml_project_template.example_data:main"
ml-template-train = "ml_project_template.train:main"
ml-template-predict = "ml_project_template.predict:main"

[tool.setuptools.packages.find]
where = ["src"]
