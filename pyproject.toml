[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-project-template"
version = "0.1.0"
description = "A progressive, executable template for tabular machine-learning projects."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3,<2",
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
experiment = [
    "jupyter>=1,<2",
    "matplotlib>=3.8,<4",
    "mlflow>=2.10,<4",
    "seaborn>=0.13,<1",
    "statsmodels>=0.14,<1",
]
app = ["streamlit>=1.30,<2"]
serve = [
    "fastapi>=0.115,<1",
    "mlflow>=2.10,<4",
    "prometheus-client>=0.20,<1",
    "uvicorn>=0.30,<1",
]
dev = [
    "bandit>=1.7,<2",
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
]

[project.scripts]
ml-template-generate-data = "ml_project_template.example_data:main"
ml-template-prepare-data = "ml_project_template.prepare_data:main"
ml-template-train = "ml_project_template.train:main"
ml-template-predict = "ml_project_template.predict:main"
ml-template-experiment = "ml_project_template.experiment:main"
ml-template-package-model = "ml_project_template.model_package:build_main"
ml-template-validate-package = "ml_project_template.model_package:validate_main"
ml-template-serve = "ml_project_template.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=ml_project_template",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "joblib",
    "mlflow",
    "mlflow.*",
    "numpy",
    "numpy.*",
    "pandas",
    "prometheus_client",
    "sklearn.*",
]
follow_imports = "skip"
ignore_missing_imports = true
